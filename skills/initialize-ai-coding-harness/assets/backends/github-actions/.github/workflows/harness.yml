name: Harness

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Registered Harness Task ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run registered validation
        run: "{{ validation_command }}"
