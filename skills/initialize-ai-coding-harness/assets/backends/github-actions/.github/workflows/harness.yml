name: Harness

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Registered Harness Task ID
        required: true
        type: string
      request_digest:
        description: Digest of the Harness Request
        required: true
        type: string
      confirmed:
        description: Current confirmation for an expensive or critical Task
        required: true
        default: false
        type: boolean
      target:
        description: Exact base ref for a delivery Task
        required: false
        type: string
      source_ref:
        description: Exact source ref for pull-request:create
        required: false
        type: string
      commit_sha:
        description: Expected source or pull-request head SHA
        required: false
        type: string
      pull_request_number:
        description: Pull request number for merge:pull-request or branch:delete
        required: false
        type: string
      merge_method:
        description: merge, squash, or rebase
        required: false
        type: string

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Validate registered request shape
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
          REQUEST_DIGEST: ${{ inputs.request_digest }}
          CONFIRMED: ${{ inputs.confirmed }}
        run: |
          set -eu
          test -n "$REQUEST_DIGEST"
          case "$TASK_ID" in
            pull-request:create)
              test "$CONFIRMED" = "true"
              test -n "${{ inputs.target }}"
              test -n "${{ inputs.source_ref }}"
              test -n "${{ inputs.commit_sha }}"
              ;;
            merge:pull-request)
              test "$CONFIRMED" = "true"
              test -n "${{ inputs.target }}"
              test -n "${{ inputs.pull_request_number }}"
              test -n "${{ inputs.commit_sha }}"
              case "${{ inputs.merge_method }}" in
                merge|squash|rebase) ;;
                *) exit 64 ;;
              esac
              ;;
            branch:delete)
              test "$CONFIRMED" = "true"
              test -n "${{ inputs.target }}"
              test -n "${{ inputs.pull_request_number }}"
              test -n "${{ inputs.commit_sha }}"
              printf '%s\n' "${{ inputs.target }}" |
                grep -Eq '^refs/heads/(codex|agent)/[A-Za-z0-9._/-]+$'
              ;;
            *) ;;
          esac

  validate:
    if: inputs.task_id != 'pull-request:create' && inputs.task_id != 'merge:pull-request' && inputs.task_id != 'branch:delete'
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run registered validation
        run: "{{ validation_command }}"

  pull-request:
    if: inputs.task_id == 'pull-request:create'
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Verify exact source SHA and create pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_HEAD_SHA: ${{ inputs.commit_sha }}
        run: |
          set -eu
          base="${TARGET#refs/heads/}"
          head="${SOURCE_REF#refs/heads/}"
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${head}" --jq '.object.sha')"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$base" --head "$head" \
            --title "Merge ${head} into ${base}" \
            --body "Created by confirmed Harness task pull-request:create."

  merge:
    if: inputs.task_id == 'merge:pull-request'
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify exact pull request binding and merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.commit_sha }}
          MERGE_METHOD: ${{ inputs.merge_method }}
        run: |
          set -eu
          base="${TARGET#refs/heads/}"
          actual_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          actual_base="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq '.baseRefName')"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"
          test "$actual_base" = "$base"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            "--${MERGE_METHOD}" --match-head-commit "$EXPECTED_HEAD_SHA"

  push-delete-branch:
    if: inputs.task_id == 'branch:delete'
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete exact merged private branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.commit_sha }}
          REQUEST_DIGEST: ${{ inputs.request_digest }}
        run: |
          set -eu
          printf '%s\n' "$TARGET" |
            grep -Eq '^refs/heads/(codex|agent)/[A-Za-z0-9._/-]+$'
          branch="${TARGET#refs/heads/}"
          case "$branch" in
            *..*|*//*|*/|*[\*\?\[\]\{\}\\\:\^\~\ ]*) exit 64 ;;
          esac
          actual_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
          test "$actual_sha" = "$EXPECTED_HEAD_SHA"
          pr_state="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
          pr_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq '.headRefName')"
          pr_head_sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          test "$pr_state" = "MERGED"
          test "$pr_head" = "$branch"
          test "$pr_head_sha" = "$EXPECTED_HEAD_SHA"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            exit 1
          fi
          mkdir -p .harness/reports
          jq -n \
            --arg task_id "branch:delete" \
            --arg request_digest "$REQUEST_DIGEST" \
            --arg run_id "actions-run:${GITHUB_RUN_ID}" \
            --arg target "$TARGET" \
            --arg commit_sha "$EXPECTED_HEAD_SHA" \
            --arg pull_request_number "$PR_NUMBER" \
            '{task_id: $task_id, request_digest: $request_digest, run_id: $run_id, target: $target, commit_sha: $commit_sha, pull_request_number: $pull_request_number, postcondition: "remote-ref-absent", status: "completed"}' \
            > .harness/reports/branch-delete.json
      - name: Upload branch deletion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: branch-delete-evidence
          path: .harness/reports/branch-delete.json
          if-no-files-found: error
          retention-days: 30
