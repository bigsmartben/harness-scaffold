tools:
  - id: repository-search
    type: cli
    purpose: repository-text-search
    capability: repository-search
    entrypoint: rg
    invocation_mode: direct
    version_source:
      command: rg
      arguments: [--version]
    working_directory: repository-root
    use_when: [search source, tests, or configuration]
    do_not_use_when: [execute project validation]
    inputs: {}
    outputs: {}
    constraints: [read-only]
  - id: project-tests
    type: project-action
    purpose: validate-project
    capability: project-tests
    invocation_mode: managed
    task_ref: "{{ task_id }}"
    working_directory: repository-root
    use_when: [validate affected project changes]
    do_not_use_when: [perform read-only repository search]
    inputs: {}
    outputs: {}
    constraints: []
  - id: project-publish
    type: project-action
    purpose: publish-project
    capability: project-publish
    invocation_mode: managed
    task_ref: "{{ publish_task_id }}"
    working_directory: repository-root
    use_when: [publish a separately confirmed version]
    do_not_use_when: [validate an unmerged change]
    inputs: {}
    outputs: {}
    constraints: [independent confirmation required]
