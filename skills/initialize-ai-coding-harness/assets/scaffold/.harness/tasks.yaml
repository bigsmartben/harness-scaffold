tasks:
  - id: "{{ task_id }}"
    category: test
    automation_level: routine
    auto_allowed: true
    command_source: "{{ command_source }}"
    backend: "{{ backend }}"
    working_directory: repository-root
    supports_scope: affected
    timeout: 5m
    outputs:
      report: ".harness/reports/{{ task_report }}"
  - id: "{{ publish_task_id }}"
    category: publish
    automation_level: critical
    auto_allowed: false
    command_source: harness-generated
    backend: "{{ backend }}"
    working_directory: repository-root
    supports_scope: publish
    timeout: 10m
    outputs:
      report: .harness/reports/publish.json
