tools:
  - id: harness-cli
    type: cli
    purpose: invoke-the-deterministic-harness-core
    capability: harness-runtime
    action_semantics: ordinary
    entrypoint: uv
    arguments:
      - run
      - sdd-harness
    invocation_mode: direct
    version_source: pyproject.toml#project.version
    working_directory: repository-root
    use_when:
      - inspect, initialize, migrate, or run a registered local task_ref
    do_not_use_when:
      - bypass a controlled delivery boundary
    inputs:
      arguments: argv
    outputs:
      format: json-or-text
    constraints:
      - use machine JSON for adapters

  - id: repository-search
    type: cli
    purpose: repository-text-search
    capability: repository-search
    action_semantics: ordinary
    entrypoint: rg
    invocation_mode: direct
    version_source:
      command: rg
      arguments:
        - --version
    working_directory: repository-root
    use_when:
      - locate source, tests, configuration, or documentation
    do_not_use_when:
      - run project validation
    inputs:
      query: string
    outputs:
      matches: text
    constraints:
      - read-only

  - id: python-read-analysis
    type: runtime
    purpose: execute-read-only-project-analysis
    capability: python-analysis
    action_semantics: ordinary
    entrypoint: uv
    arguments:
      - run
      - python
    invocation_mode: direct
    version_source: pyproject.toml#project.requires-python
    working_directory: repository-root
    use_when:
      - run a registered read-only Python analysis script
    do_not_use_when:
      - lint, validate, test, build, package, merge, or publish
    inputs:
      script: registered-read-only-script
    outputs:
      format: text-or-json
    constraints:
      - no project mutation

  - id: github-server
    type: mcp-server
    purpose: index-github-capabilities
    capability: github
    action_semantics: ordinary
    entrypoint: github-connector
    invocation_mode: direct
    version_source: connector-manifest
    working_directory: repository-root
    use_when:
      - discover registered GitHub tools
    do_not_use_when:
      - perform project delivery actions
    inputs: {}
    outputs:
      tools: connector-tools
    constraints:
      - registry entry is not authorization

  - id: github-get-file
    type: mcp-tool
    purpose: read-github-file
    capability: github-file-read
    action_semantics: ordinary
    entrypoint: github.get_file_contents
    server_ref: github-server
    method: get_file_contents
    invocation_mode: direct
    version_source: connector-manifest
    working_directory: repository-root
    use_when:
      - read a repository file through the GitHub connector
    do_not_use_when:
      - create releases, merge, or publish
    inputs:
      repository: string
      path: string
    outputs:
      content: text
    constraints:
      - read-only

  - id: contract-tests
    type: project-action
    purpose: validate-harness-contracts
    capability: project-test
    action_semantics: test
    invocation_mode: managed
    task_ref: test:contracts
    working_directory: repository-root
    use_when:
      - validate Harness contracts and templates
    do_not_use_when:
      - perform ordinary read-only analysis
    inputs:
      scope: validation-level
    outputs:
      evidence: .harness/reports/contracts.json
    constraints:
      - invoke only through Harness

  - id: distribution-smoke
    type: project-action
    purpose: build-wheel-and-verify-isolated-uv-tool-install
    capability: distribution-test
    action_semantics: test
    invocation_mode: managed
    task_ref: test:distribution-smoke
    working_directory: repository-root
    use_when:
      - verify the public sdd-harness distribution and init entrypoint
    do_not_use_when:
      - publish a package or modify the user tool installation
    inputs:
      scope: contract
    outputs:
      evidence: .harness/reports/distribution-smoke.json
    constraints:
      - invoke only through Harness
      - isolate UV_TOOL_DIR and UV_TOOL_BIN_DIR

  - id: github-contract-check
    type: project-action
    purpose: validate-harness-contracts-on-github
    capability: project-test
    action_semantics: test
    invocation_mode: managed
    task_ref: test:contracts-ci
    working_directory: repository-root
    use_when:
      - produce the routine Required Check on GitHub
    do_not_use_when:
      - run full CI
    inputs:
      scope: contract
    outputs:
      evidence: .harness/reports/contracts-ci.json
    constraints:
      - workflow_dispatch only

  - id: github-full-ci
    type: project-action
    purpose: run-confirmed-full-ci
    capability: project-ci
    action_semantics: ci
    invocation_mode: managed
    task_ref: ci:full
    working_directory: repository-root
    use_when:
      - run Full CI after current confirmation
    do_not_use_when:
      - perform routine validation
    inputs:
      scope: full
    outputs:
      evidence: .harness/reports/full-ci.json
    constraints:
      - current confirmation required
      - workflow_dispatch only

  - id: github-production-gate-evidence
    type: project-action
    purpose: validate-protected-environment-approval
    capability: platform-validation
    action_semantics: validation
    invocation_mode: managed
    task_ref: platform:gate-evidence
    working_directory: repository-root
    use_when:
      - prove that an inert Job waits for production approval
    do_not_use_when:
      - publish or deploy an artifact
    inputs:
      scope: integration
    outputs:
      evidence: .harness/reports/production-gate.json
    constraints:
      - current confirmation required
      - no delivery side effects
      - workflow_dispatch only

  - id: git-push-branch
    type: project-action
    purpose: push-confirmed-commit-to-remote-branch
    capability: project-push
    action_semantics: push
    invocation_mode: managed
    entrypoint: sdd-harness
    arguments:
      - push-apply
    version_source: pyproject.toml#project.version
    task_ref: push:branch
    working_directory: repository-root
    use_when:
      - push an exact confirmed commit to an exact remote branch
    do_not_use_when:
      - force push, merge, publish, release, or deploy
    inputs:
      scope: publish
      target: remote-branch
      commit_sha: git-commit
    outputs:
      evidence: .harness/reports/push-branch.json
    constraints:
      - current confirmation required
      - no force push
      - git-remote backend only
  - id: github-create-pull-request
    type: project-action
    purpose: create-confirmed-pull-request
    capability: project-pull-request
    action_semantics: pull-request
    invocation_mode: managed
    task_ref: pull-request:create
    working_directory: repository-root
    use_when:
      - create a pull request for one exact source ref and base ref
    do_not_use_when:
      - push commits or merge a pull request
    inputs:
      scope: publish
      source_ref: remote-branch
      target: base-branch
      commit_sha: git-commit
    outputs:
      evidence: .harness/reports/pull-request-create.json
    constraints:
      - current confirmation required
      - github-actions platform evidence required
  - id: github-merge-pull-request
    type: project-action
    purpose: merge-confirmed-pull-request
    capability: project-merge
    action_semantics: merge
    invocation_mode: managed
    task_ref: merge:pull-request
    working_directory: repository-root
    use_when:
      - merge one exact pull request head into one protected base ref
    do_not_use_when:
      - create a pull request or bypass required checks
    inputs:
      scope: publish
      target: protected-base-ref
      pull_request_number: positive-integer
      commit_sha: expected-head-sha
      merge_method: merge-or-squash-or-rebase
    outputs:
      evidence: .harness/reports/merge-pull-request.json
    constraints:
      - independent current confirmation required
      - required checks must pass
      - github-actions platform evidence required
