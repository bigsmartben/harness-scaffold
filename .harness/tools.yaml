tools:
  - id: repository-search
    type: cli
    purpose: repository-text-search
    capability: repository-search
    action_semantics: ordinary
    entrypoint: rg
    invocation_mode: direct
    version_source:
      command: rg
      arguments:
        - --version
    working_directory: repository-root
    use_when:
      - locate source, tests, configuration, or documentation
    do_not_use_when:
      - run project validation
    inputs:
      query: string
    outputs:
      matches: text
    constraints:
      - read-only

  - id: python-read-analysis
    type: runtime
    purpose: execute-read-only-project-analysis
    capability: python-analysis
    action_semantics: ordinary
    entrypoint: uv
    arguments:
      - run
      - python
    invocation_mode: direct
    version_source: pyproject.toml#project.requires-python
    working_directory: repository-root
    use_when:
      - run a registered read-only Python analysis script
    do_not_use_when:
      - lint, validate, test, build, package, merge, or publish
    inputs:
      script: registered-read-only-script
    outputs:
      format: text-or-json
    constraints:
      - no project mutation

  - id: github-server
    type: mcp-server
    purpose: index-github-capabilities
    capability: github
    action_semantics: ordinary
    entrypoint: github-connector
    invocation_mode: direct
    version_source: connector-manifest
    working_directory: repository-root
    use_when:
      - discover registered GitHub tools
    do_not_use_when:
      - perform project delivery actions
    inputs: {}
    outputs:
      tools: connector-tools
    constraints:
      - registry entry is not authorization

  - id: github-get-file
    type: mcp-tool
    purpose: read-github-file
    capability: github-file-read
    action_semantics: ordinary
    entrypoint: github.get_file_contents
    server_ref: github-server
    method: get_file_contents
    invocation_mode: direct
    version_source: connector-manifest
    working_directory: repository-root
    use_when:
      - read a repository file through the GitHub connector
    do_not_use_when:
      - create releases, merge, or publish
    inputs:
      repository: string
      path: string
    outputs:
      content: text
    constraints:
      - read-only

  - id: github-search-issues
    type: mcp-tool
    purpose: search-github-issues
    capability: github-issue-read
    action_semantics: ordinary
    server_ref: github-server
    method: search_issues
    invocation_mode: direct
    version_source: connector-manifest
    working_directory: repository-root
    use_when:
      - find or inspect issues in an exact GitHub repository
    do_not_use_when:
      - the repository target is ambiguous
    inputs:
      repository_full_name: owner/name
      query: string
    outputs:
      issues: normalized-issue-list
    constraints:
      - read-only
      - exact repository required

  - id: github-create-issue
    type: mcp-tool
    purpose: create-confirmed-github-issue
    capability: github-issue-create
    action_semantics: ordinary
    server_ref: github-server
    method: create_issue
    invocation_mode: direct
    version_source: connector-manifest
    working_directory: repository-root
    use_when:
      - create one issue in an exact GitHub repository
    do_not_use_when:
      - the repository target is ambiguous
    inputs:
      repository_full_name: owner/name
      title: string
      body: markdown
      labels: string-list
      assignees: github-user-list
      milestone: positive-integer
    outputs:
      issue: normalized-issue
    constraints:
      - restate exact target
      - current user confirmation required

  - id: github-update-issue
    type: mcp-tool
    purpose: update-confirmed-github-issue
    capability: github-issue-update
    action_semantics: ordinary
    server_ref: github-server
    method: update_issue
    invocation_mode: direct
    version_source: connector-manifest
    working_directory: repository-root
    use_when:
      - update title, body, state, labels, assignees, or milestone
      - close or reopen one exact issue
    do_not_use_when:
      - the repository or issue target is ambiguous
    inputs:
      repository_full_name: owner/name
      issue_number: positive-integer
      patch: issue-fields
    outputs:
      issue: normalized-issue
    constraints:
      - restate exact issue and replacement fields
      - current user confirmation required

  - id: github-add-issue-comment
    type: mcp-tool
    purpose: add-confirmed-github-issue-comment
    capability: github-issue-comment-create
    action_semantics: ordinary
    server_ref: github-server
    method: add_comment_to_issue
    invocation_mode: direct
    version_source: connector-manifest
    working_directory: repository-root
    use_when:
      - add one top-level comment to an exact issue
    do_not_use_when:
      - the repository or issue target is ambiguous
    inputs:
      repository_full_name: owner/name
      issue_number: positive-integer
      comment: markdown
    outputs:
      comment: normalized-issue-comment
    constraints:
      - restate exact target
      - current user confirmation required

  - id: github-update-issue-comment
    type: mcp-tool
    purpose: update-confirmed-github-issue-comment
    capability: github-issue-comment-update
    action_semantics: ordinary
    server_ref: github-server
    method: update_issue_comment
    invocation_mode: direct
    version_source: connector-manifest
    working_directory: repository-root
    use_when:
      - replace one exact top-level issue comment
    do_not_use_when:
      - the repository or comment target is ambiguous
    inputs:
      repository_full_name: owner/name
      comment_id: positive-integer
      comment: markdown
    outputs:
      comment: normalized-issue-comment
    constraints:
      - restate exact target
      - current user confirmation required

  - id: github-add-issue-labels
    type: mcp-tool
    purpose: add-confirmed-github-issue-labels
    capability: github-issue-label-add
    action_semantics: ordinary
    server_ref: github-server
    method: add_issue_labels
    invocation_mode: direct
    version_source: connector-manifest
    working_directory: repository-root
    use_when:
      - add labels without replacing the existing label set
    do_not_use_when:
      - the repository or issue target is ambiguous
    inputs:
      repository_full_name: owner/name
      issue_number: positive-integer
      labels: string-list
    outputs:
      issue: normalized-issue
    constraints:
      - restate exact target
      - current user confirmation required

  - id: github-remove-issue-label
    type: mcp-tool
    purpose: remove-confirmed-github-issue-label
    capability: github-issue-label-remove
    action_semantics: ordinary
    server_ref: github-server
    method: remove_issue_label
    invocation_mode: direct
    version_source: connector-manifest
    working_directory: repository-root
    use_when:
      - remove one exact label from one exact issue
    do_not_use_when:
      - the repository or issue target is ambiguous
    inputs:
      repository_full_name: owner/name
      issue_number: positive-integer
      label: string
    outputs:
      issue: normalized-issue
    constraints:
      - restate exact target
      - current user confirmation required

  - id: github-add-issue-assignees
    type: mcp-tool
    purpose: add-confirmed-github-issue-assignees
    capability: github-issue-assignee-add
    action_semantics: ordinary
    server_ref: github-server
    method: add_issue_assignees
    invocation_mode: direct
    version_source: connector-manifest
    working_directory: repository-root
    use_when:
      - add assignees without replacing the existing assignee set
    do_not_use_when:
      - the repository or issue target is ambiguous
    inputs:
      repository_full_name: owner/name
      issue_number: positive-integer
      assignees: github-user-list
    outputs:
      issue: normalized-issue
    constraints:
      - restate exact target
      - current user confirmation required

  - id: github-remove-issue-assignees
    type: mcp-tool
    purpose: remove-confirmed-github-issue-assignees
    capability: github-issue-assignee-remove
    action_semantics: ordinary
    server_ref: github-server
    method: remove_issue_assignees
    invocation_mode: direct
    version_source: connector-manifest
    working_directory: repository-root
    use_when:
      - remove assignees from one exact issue
    do_not_use_when:
      - the repository or issue target is ambiguous
    inputs:
      repository_full_name: owner/name
      issue_number: positive-integer
      assignees: github-user-list
    outputs:
      issue: normalized-issue
    constraints:
      - restate exact target
      - current user confirmation required

  - id: contract-tests
    type: project-action
    purpose: validate-harness-contracts
    capability: project-test
    action_semantics: test
    invocation_mode: managed
    task_ref: test:contracts
    working_directory: repository-root
    use_when:
      - validate Harness contracts and templates
    do_not_use_when:
      - perform ordinary read-only analysis
    inputs:
      scope: validation-level
    outputs:
      evidence: .harness/reports/contracts.json
    constraints:
      - invoke only through Harness

  - id: distribution-smoke
    type: project-action
    purpose: build-wheel-and-verify-isolated-uv-tool-install
    capability: distribution-test
    action_semantics: test
    invocation_mode: managed
    task_ref: test:distribution-smoke
    working_directory: repository-root
    use_when:
      - verify the public sdd-harness distribution and init entrypoint
    do_not_use_when:
      - publish a package or modify the user tool installation
    inputs:
      scope: contract
    outputs:
      evidence: .harness/reports/distribution-smoke.json
    constraints:
      - invoke only through Harness
      - isolate UV_TOOL_DIR and UV_TOOL_BIN_DIR
  - id: package-release-wheel
    type: project-action
    purpose: build-and-upload-verified-release-wheel
    capability: distribution-package
    action_semantics: package
    invocation_mode: managed
    task_ref: package:wheel
    working_directory: repository-root
    use_when:
      - create the immutable wheel artifact for a GitHub Release
    do_not_use_when:
      - publish, tag, or release the artifact
    inputs:
      scope: publish
      commit_sha: git-commit
    outputs:
      evidence: .harness/reports/package-wheel.json
      artifact: github-actions-run
    constraints:
      - invoke only through Harness
      - build from the exact request commit
      - isolated install smoke test required

  - id: github-contract-check
    type: project-action
    purpose: validate-harness-contracts-on-github
    capability: project-test
    action_semantics: test
    invocation_mode: managed
    task_ref: test:contracts-ci
    working_directory: repository-root
    use_when:
      - produce the routine Required Check on GitHub
    do_not_use_when:
      - run full CI
    inputs:
      scope: contract
    outputs:
      evidence: .harness/reports/contracts-ci.json
    constraints:
      - workflow_dispatch only

  - id: github-full-ci
    type: project-action
    purpose: run-confirmed-full-ci
    capability: project-ci
    action_semantics: ci
    invocation_mode: managed
    task_ref: ci:full
    working_directory: repository-root
    use_when:
      - run Full CI after current confirmation
    do_not_use_when:
      - perform routine validation
    inputs:
      scope: full
    outputs:
      evidence: .harness/reports/full-ci.json
    constraints:
      - current confirmation required
      - workflow_dispatch only

  - id: github-production-gate-evidence
    type: project-action
    purpose: validate-protected-environment-approval
    capability: platform-validation
    action_semantics: validation
    invocation_mode: managed
    task_ref: platform:gate-evidence
    working_directory: repository-root
    use_when:
      - prove that an inert Job waits for production approval
    do_not_use_when:
      - publish or deploy an artifact
    inputs:
      scope: integration
    outputs:
      evidence: .harness/reports/production-gate.json
    constraints:
      - current confirmation required
      - no delivery side effects
      - workflow_dispatch only

  - id: git-push-branch
    type: project-action
    purpose: push-confirmed-commit-to-remote-branch
    capability: project-push
    action_semantics: push
    invocation_mode: managed
    task_ref: push:branch
    working_directory: repository-root
    use_when:
      - push an exact confirmed commit to an exact remote branch
    do_not_use_when:
      - force push, merge, publish, release, or deploy
    inputs:
      scope: publish
      target: remote-branch
      commit_sha: git-commit
    outputs:
      evidence: .harness/reports/push-branch.json
    constraints:
      - current confirmation required
      - no force push
      - git-remote backend only
  - id: github-delete-merged-private-branch
    type: project-action
    purpose: delete-confirmed-merged-private-branch
    capability: project-branch-delete
    action_semantics: push
    invocation_mode: managed
    task_ref: branch:delete
    working_directory: repository-root
    use_when:
      - delete one exact merged private remote branch
    do_not_use_when:
      - delete a controlled, unclassified, or unmerged branch
    inputs:
      scope: publish
      target: private-remote-branch-ref
      pull_request_number: positive-integer
      commit_sha: expected-head-sha
    outputs:
      evidence: .harness/reports/branch-delete.json
    constraints:
      - independent current confirmation required
      - exact refs/heads/codex or refs/heads/agent target required
      - merged pull request and expected head SHA must match
      - github-actions platform evidence required
  - id: github-create-pull-request
    type: project-action
    purpose: create-confirmed-pull-request
    capability: project-pull-request
    action_semantics: pull-request
    invocation_mode: managed
    task_ref: pull-request:create
    working_directory: repository-root
    use_when:
      - create a pull request for one exact source ref and base ref
    do_not_use_when:
      - push commits or merge a pull request
    inputs:
      scope: publish
      source_ref: remote-branch
      target: base-branch
      commit_sha: git-commit
    outputs:
      evidence: .harness/reports/pull-request-create.json
    constraints:
      - current confirmation required
      - github-actions platform evidence required
  - id: github-merge-pull-request
    type: project-action
    purpose: merge-confirmed-pull-request
    capability: project-merge
    action_semantics: merge
    invocation_mode: managed
    task_ref: merge:pull-request
    working_directory: repository-root
    use_when:
      - merge one exact pull request head into one protected base ref
    do_not_use_when:
      - create a pull request or bypass required checks
    inputs:
      scope: publish
      target: protected-base-ref
      pull_request_number: positive-integer
      commit_sha: expected-head-sha
      merge_method: merge-or-squash-or-rebase
    outputs:
      evidence: .harness/reports/merge-pull-request.json
    constraints:
      - independent current confirmation required
      - required checks must pass
      - github-actions platform evidence required
  - id: github-create-release
    type: project-action
    purpose: create-confirmed-github-release
    capability: project-release
    action_semantics: release
    invocation_mode: managed
    task_ref: release:github
    working_directory: repository-root
    use_when:
      - publish one exact version and verified artifact as a GitHub Release
    do_not_use_when:
      - build an artifact, publish to PyPI, or overwrite a conflicting release
    inputs:
      scope: publish
      target: tag-ref
      source_ref: github-actions-run
      commit_sha: git-commit
      version: release-version
      artifact_digest: sha256
      environment: protected-environment
    outputs:
      evidence: .harness/reports/release-github.json
    constraints:
      - independent current confirmation required
      - protected production environment approval required
      - exact package run and artifact digest required
      - idempotent retry only; conflicting release replacement forbidden
