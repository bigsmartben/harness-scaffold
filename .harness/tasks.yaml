tasks:
  - id: test:contracts
    category: test
    automation_level: routine
    auto_allowed: true
    command_source: pyproject.toml#tool.pytest.ini_options
    command:
      - uv
      - run
      - pytest
    backend: local
    working_directory: repository-root
    supports_scope: contract
    timeout: 5m
    outputs:
      report: .harness/reports/contracts.json
  - id: test:contracts-ci
    category: test
    automation_level: routine
    auto_allowed: true
    source: .github/workflows/routine-contracts.yml#contracts
    backend: github-actions
    working_directory: repository-root
    supports_scope: contract
    timeout: 10m
    outputs:
      report: .harness/reports/contracts-ci.json
  - id: ci:full
    category: ci
    automation_level: expensive
    auto_allowed: false
    source: .github/workflows/harness.yml#full-ci
    backend: github-actions
    working_directory: repository-root
    supports_scope: full
    timeout: 20m
    outputs:
      report: .harness/reports/full-ci.json
  - id: platform:gate-evidence
    category: validation
    automation_level: expensive
    auto_allowed: false
    source: .github/workflows/delivery-gate-evidence.yml#production-gate
    backend: github-actions
    working_directory: repository-root
    supports_scope: integration
    timeout: 10m
    outputs:
      report: .harness/reports/production-gate.json
  - id: push:branch
    category: push
    automation_level: critical
    auto_allowed: false
    source: .harness/adapters/git-remote.yaml#origin
    backend: git-remote
    working_directory: repository-root
    supports_scope: publish
    timeout: 2m
    outputs:
      report: .harness/reports/push-branch.json
  - id: pull-request:create
    category: pull-request
    automation_level: critical
    auto_allowed: false
    source: .github/workflows/harness.yml#jobs.pull-request
    backend: github-actions
    working_directory: repository-root
    supports_scope: publish
    timeout: 10m
    outputs:
      report: .harness/reports/pull-request-create.json
  - id: merge:pull-request
    category: merge
    automation_level: critical
    auto_allowed: false
    source: .github/workflows/harness.yml#jobs.merge
    backend: github-actions
    working_directory: repository-root
    supports_scope: publish
    timeout: 10m
    outputs:
      report: .harness/reports/merge-pull-request.json
