schema_version: 3.0.1
rule_instances:
  specification: []
  implementation:
    - rule_id: github-actions-platform-boundary
      directive: Keep GitHub Actions dependencies in the maintainer platform layer and outside Harness distributions, CLI behavior, and consumer initialization output.
      scope:
        - .github/workflows/**
        - pyproject.toml
        - scripts/**
  verification:
    - rule_id: verify-github-actions-dependencies
      directive: Verify that external Actions use audited full commit SHAs with Node.js 24 and that Harness distributions remain uv and Python only.
      scope:
        - .github/workflows/**
        - scripts/**
        - tests/**
  delivery: []
