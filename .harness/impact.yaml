rules:
  - id: docs-only
    paths:
      - "**/*.md"
    validation_level: inspect
    reason: documentation-only changes have no runtime effect

  - id: contract-code
    paths:
      - skills/initialize-ai-coding-harness/assets/schemas/**
      - skills/initialize-ai-coding-harness/assets/scaffold/**
      - tests/**
      - pyproject.toml
      - uv.lock
    validation_level: contract
    tasks:
      - test:contracts
    reason: machine contracts, templates, or tests require contract validation

  - id: harness-semantics
    paths:
      - AGENTS.md
      - .harness/*.yaml
      - .harness/pipelines/**
      - .harness/adapters/**
      - skills/initialize-ai-coding-harness/SKILL.md
      - skills/initialize-ai-coding-harness/agents/**
      - skills/initialize-ai-coding-harness/references/**
      - skills/initialize-ai-coding-harness/scripts/**
      - evals/**
    validation_level: full
    tasks:
      - test:contracts
      - ci:full
    reason: Skill routing, execution semantics, or eval behavior requires a Full fact and full validation

  - id: ci-platform
    paths:
      - .github/**
      - .harness/adapters/github-actions.yaml
    validation_level: full
    tasks:
      - test:contracts-ci
      - ci:full
    reason: CI/CD platform behavior requires a Full fact and platform checks
