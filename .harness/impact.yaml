rules:
  - id: docs-only
    paths:
      - "**/*.md"
    validation_level: T0
    reason: documentation-only changes have no runtime effect

  - id: implementation
    paths:
      - src/**
      - tests/**
    validation_level: T1
    tasks:
      - test:contracts
    reason: implementation and tests require contract validation

  - id: public-contract
    paths:
      - src/harness_core/resources/schemas/**
      - src/harness_core/resources/repo_skill/**
      - plugins/**
    validation_level: T2
    tasks:
      - test:contracts
      - test:distribution-smoke
    reason: public contracts and generated copies require integration validation

  - id: core-and-delivery
    paths:
      - src/harness_core/**
      - pyproject.toml
      - uv.lock
      - .github/**
      - .harness/**
    validation_level: T3
    tasks:
      - test:contracts
      - test:distribution-smoke
    reason: core, dependency, migration, and CI/CD changes require full local evidence
