source:
  kind: github-api-capture
  repository: example/harness
credentials:
  agent_has_delivery_credentials: false
  default_token_permissions: read-only
  oidc: short-lived
branch_protection:
  enabled: true
  required_checks:
    - unit
    - integration
environments:
  production:
    protected: true
    required_reviewers: 1
workflows:
  - path: .github/workflows/publish.yml
    automation_level: critical
    triggers:
      - workflow_dispatch
    platform_gate_enforced: true
