source:
  kind: synthetic-negative-case
credentials:
  agent_has_delivery_credentials: true
  default_token_permissions: write-all
branch_protection:
  enabled: false
  required_checks:
    - unit
environments:
  production:
    protected: false
    required_reviewers: 0
workflows:
  - path: .github/workflows/publish.yml
    automation_level: critical
    triggers:
      - push
    platform_gate_enforced: false
