tasks:
  - id: test:python
    category: test
    automation_level: routine
    auto_allowed: true
    source: pyproject.toml#tool.pytest.ini_options
    command:
      - uv
      - run
      - pytest
    backend: local
    working_directory: repository-root
    supports_scope: affected
    timeout: 5m
    outputs:
      report: .harness/reports/python-tests.json
  - id: publish:package
    category: publish
    automation_level: critical
    auto_allowed: false
    source: .github/workflows/publish.yml#jobs.publish
    backend: github-actions
    working_directory: repository-root
    supports_scope: publish
    timeout: 10m
    outputs:
      report: .harness/reports/publish.json
