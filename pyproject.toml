[project]
name = "sdd-harness"
version = "1.0.0"
description = "Deterministic contracts and execution layer for AI Coding Harness"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema>=4.23,<5",
  "pyyaml>=6.0.2,<7",
  "referencing>=0.35,<1",
]

[project.scripts]
sdd-harness = "harness_core.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skills/initialize-ai-coding-harness/scripts/harness_core"]

[tool.hatch.build.targets.wheel.force-include]
"skills/initialize-ai-coding-harness/assets/schemas" = "harness_core/schemas"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["skills/initialize-ai-coding-harness/scripts"]
