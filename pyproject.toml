[project]
name = "sdd-harness"
version = "3.0.0"
description = "Fixed 2-2-4 specification governance scaffold"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema>=4.23,<5",
  "pyyaml>=6.0.2,<7",
]

[project.scripts]
sdd-harness = "harness_core.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = "==0.11.20"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_core"]

[tool.hatch.build]
exclude = [
  "/.codex/**",
  "/.harness/cache/**",
  "/.harness/reports/**",
  "/.harness/runs/**",
  "/.harness/runtime/**",
  "/.pytest_cache/**",
  "/.tmp/**",
  "/.venv/**",
  "/dist/**",
  "/evals/results/**",
  "/Users*cachepytest/**",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
