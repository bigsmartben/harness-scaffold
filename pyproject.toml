[project]
name = "ai-coding-harness"
version = "0.2.0"
description = "Deterministic contracts and execution layer for AI Coding Harness"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema>=4.23,<5",
  "pyyaml>=6.0.2,<7",
  "referencing>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skills/initialize-ai-coding-harness/scripts/harness_core"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["skills/initialize-ai-coding-harness/scripts"]
