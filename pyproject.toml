[project]
name = "sdd-harness"
version = "2.0.0"
description = "Repository-local SDD governance scaffold for Codex App and Codex CLI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema>=4.23,<5",
  "pyyaml>=6.0.2,<7",
  "referencing>=0.35,<1",
]

[project.scripts]
sdd-harness = "harness_core.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_core"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
