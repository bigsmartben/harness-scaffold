rules:
  - id: operator-docs
    paths:
      - docs/**
    validation_level: inspect
    tasks:
      - docs:check
  - id: inventory-module
    paths:
      - modules/inventory/**
    validation_level: affected
    tasks:
      - test:inventory
  - id: billing-module
    paths:
      - modules/billing/**
    validation_level: affected
    tasks:
      - test:billing
  - id: public-contracts
    paths:
      - contracts/**
    validation_level: contract
    tasks:
      - test:contract
  - id: harness-or-ci
    paths:
      - .harness/**
      - .github/workflows/**
    validation_level: full
    tasks:
      - ci:full
