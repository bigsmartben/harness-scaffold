credentials:
  agent_has_delivery_credentials: false
  default_token_permissions: read-only
branch_protection:
  enabled: true
  required_checks:
    - routine-validation
workflows:
  - path: .github/workflows/delivery.yml
    automation_level: critical
    triggers:
      - workflow_dispatch
    platform_gate_enforced: true
environments:
  production:
    protected: true
    required_reviewers: 1
