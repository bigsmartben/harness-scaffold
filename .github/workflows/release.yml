name: Release

on:
  push:
    tags:
      - v3.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run python -m pytest
      - run: uv build
      - run: uv run python scripts/smoke_distribution.py
      - run: uv run sdd-harness validate --json
      - name: Verify release version
        run: |
          test "$GITHUB_REF_NAME" = "v3.0.0"
          test "$(uv run sdd-harness --version)" = "sdd-harness 3.0.0"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/sdd_harness-3.0.0-py3-none-any.whl \
            dist/sdd_harness-3.0.0.tar.gz \
            --verify-tag \
            --notes-file docs/release-notes-3.0.0.md \
            --title "Harness 3.0.0"
