name: Release

on:
  push:
    tags:
      - v3.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python -m pytest
      - run: uv build
      - run: uv run python scripts/smoke_distribution.py
      - run: uv run sdd-harness validate --json
      - name: Verify release version
        run: |
          test "$GITHUB_REF_NAME" = "v3.0.0"
          test "$(uv run sdd-harness --version)" = "sdd-harness 3.0.0"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/sdd_harness-3.0.0-py3-none-any.whl \
            dist/sdd_harness-3.0.0.tar.gz \
            --verify-tag \
            --notes-file docs/release-notes-3.0.0.md \
            --title "Harness 3.0.0"
