name: Routine Contracts

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      request_digest:
        description: Optional digest of the routine Harness Request
        required: false
        type: string

permissions:
  contents: read

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run routine contract checks
        run: uv run python -m pytest
