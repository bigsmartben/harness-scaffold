name: Delivery Gate Evidence

on:
  workflow_dispatch:
    inputs:
      request_digest:
        description: Digest of the confirmed Harness Request
        required: true
        type: string
      artifact_digest:
        description: Digest of the inert validation artifact
        required: true
        type: string
      confirmed:
        description: Current confirmation for this gate validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  authorize:
    name: authorize-delivery-gate
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmed request
        shell: bash
        env:
          REQUEST_DIGEST: ${{ inputs.request_digest }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          CONFIRMED: ${{ inputs.confirmed }}
        run: |
          set -eu
          test "$CONFIRMED" = "true"
          case "$REQUEST_DIGEST" in
            sha256:*) ;;
            *) exit 64 ;;
          esac
          case "$ARTIFACT_DIGEST" in
            sha256:*) ;;
            *) exit 64 ;;
          esac

  production-gate:
    name: production-gate
    needs: authorize
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Record inert gate evidence
        shell: bash
        env:
          REQUEST_DIGEST: ${{ inputs.request_digest }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
        run: |
          {
            echo "## Protected Environment evidence"
            echo
            echo "- Request: \`$REQUEST_DIGEST\`"
            echo "- Artifact: \`$ARTIFACT_DIGEST\`"
            echo "- Side effects: none"
          } >> "$GITHUB_STEP_SUMMARY"
